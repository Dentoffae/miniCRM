# Запуск: из корня проекта EXCEL
#   docker compose up --build
#
# Папка ./crm смонтирована в контейнер — правки Python сразу видны процессу после
# автоперезапуска uvicorn (Watchdog / watchmedo). БД SQLite — в именованном томе.

services:
  crm-api:
    build:
      context: .
      dockerfile: crm/Dockerfile
    container_name: excel-crm-api
    ports:
      # снаружи : внутри контейнера 8000; при занятости 8000 на хосте задайте CRM_PORT=8010
      - "${CRM_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      CRM_DB_PATH: /data/crm.sqlite3
      PYTHONPATH: /app/google
    volumes:
      - ./crm:/app/crm
      - ./google:/app/google
      - crm_sqlite:/data

volumes:
  crm_sqlite:
